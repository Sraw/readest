# The EBK reader, built as WebAssembly for Readest (see README.md). Its own workspace, not part of Readest's.
[workspace]
resolver = "2"
members = ["crates/ebk", "crates/ebk-wasm"]
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
